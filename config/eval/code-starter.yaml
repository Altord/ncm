# Inference configuration for the small training-pipeline example.
task: code-starter
checkpoints:
  generator: generator.pt
  tokenizer: tokenizer.pt

tokenizer:
  pre_tokenizer:
    name: hf
    model_id: gpt2
    special_tokens:
      eos_token: <|endoftext|>
      pad_token: <|pad|>
  vqvae:
    n_layers: 2
    embed_dim: 64
    in_vocab_size: 50258
    context_length: 64
    compression_factor: 1
    dropout: 0.0
    pre_quant_groupnorm: null
    pre_quant_dropout: 0.0
    use_qk_norm: false
    enc_layers: 0
    dec_layers: 1
    vqvae_vocab_size: [256, 256, 256, 256]
    vector_quantizer_config:
      clss: multiscale_residual_vector_quantizer
      decay: 0.95
      epsilon: 1.0e-5
      commitment_cost: 0.25
      quant_resi:
        enabled: true
        ratio: 0.5
        share_mode: 1
      aux:
        fine_drop:
          prob: 0.25
          min_keep: 1
      levels:
        use_manual_levels: true
        # Keep this hierarchy identical to the tokenizer training config.
        manual_levels: [1, 4, 16, 64]

model:
  n_layer: 4
  n_head: 4
  bias: true
  dropout: 0.0
  n_embd: 128
  context_length: 64
  prefix_len: 16
  raw_token_prefix: true
  prefix_pad_token_id: 50257
  vocab_size: [256, 256, 256]
  predict_level0: false
  attn_pattern: block_diagonal
  use_level_encoding: true
  use_rope: true
  rope_base: 10000
  use_qk_norm: false
  use_flex_attention: false
  query_level0: false
  tie_heads_to_codebook: true
  tie_heads_learn_scale: true
  ctx_encoder:
    enabled: false

generation:
  temperature: 0.8
  top_k: 0
  top_p: 1.0
  cfg_scale: 0.0
  level0_unigram: generator.pt:inference.level0_unigram

data: {}
eval:
  n_samples: 16
  seeds: [42]
  batch_size: 16
  n_shards: 1
  metric: genppl
  ref_model: gpt2
