# Domain tokenizer experiment. This trains text reconstruction only; it does not
# teach the Next Concept generator to follow game-building instructions.
task: godot-csharp-tokenizer

tokenizer:
  name: hf
  model_id: gpt2
  special_tokens:
    eos_token: <|endoftext|>
    pad_token: <|pad|>

data:
  input: data/mycode/godot-csharp-reference/train.jsonl
  format: jsonl
  text_key: text
  append_eos: true
  cache_dir: data/cache/godot-csharp/tokenizer

model:
  context_length: 64
  in_vocab_size: 50258

vqvae:
  n_layers: 2
  embed_dim: 64
  in_vocab_size: 50258
  context_length: 64
  compression_factor: 1
  dropout: 0.0
  pre_quant_groupnorm: null
  pre_quant_dropout: 0.0
  use_qk_norm: false
  enc_layers: 0
  dec_layers: 1
  vqvae_vocab_size: [256, 256, 256, 256]
  vector_quantizer_config:
    clss: multiscale_residual_vector_quantizer
    decay: 0.95
    epsilon: 1.0e-5
    commitment_cost: 0.25
    quant_resi:
      enabled: true
      ratio: 0.5
      share_mode: 1
    aux:
      fine_drop:
        prob: 0.25
        min_keep: 1
    levels:
      use_manual_levels: true
      manual_levels: [1, 4, 16, 64]

train:
  seed: 42
  device: cuda
  precision: fp32
  batch_size: 16
  grad_accum_steps: 1
  num_workers: 0
  max_steps: 1000
  warmup_steps: 50
  lr: 0.0003
  min_lr: 0.00003
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 100
  save_every: 5000
  mask_padding: true
  vq_loss_weight: 1.0
  run_dir: runs/godot-csharp/tokenizer
  validation_cache_dir: data/cache/godot-csharp/tokenizer-validation
  eval_every: 10000
  artifact_dir: artifacts/godot-csharp
  artifact_filename: tokenizer.pt
  evaluation_config: config/eval/code-starter.yaml
