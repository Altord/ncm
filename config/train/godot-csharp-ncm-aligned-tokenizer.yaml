# NCM-scale architecture ablation for code reconstruction.
# Follows the published WMT14 tokenizer's context-64 hierarchy and quantizer
# settings, while retaining the local GPT-2 base tokenizer and code-only corpus.
task: godot-csharp-ncm-aligned-tokenizer

tokenizer:
  name: hf
  model_id: gpt2
  special_tokens:
    eos_token: <|endoftext|>
    pad_token: <|pad|>

data:
  input: data/mycode/godot-csharp-code-only/train.jsonl
  format: jsonl
  text_key: text
  append_eos: true
  cache_dir: data/cache/godot-csharp-code-only/tokenizer

model:
  context_length: 64
  in_vocab_size: 50258

vqvae:
  n_layers: 6
  embed_dim: 384
  in_vocab_size: 50258
  context_length: 64
  compression_factor: 1
  checkpoint_path: artifacts/godot-csharp-ncm-aligned/tokenizer.pt
  dropout: 0.1
  pre_quant_groupnorm: 8
  pre_quant_dropout: 0.25
  use_qk_norm: true
  enc_layers: 0
  dec_layers: 1
  vqvae_vocab_size: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096]
  vector_quantizer_config:
    clss: multiscale_residual_vector_quantizer
    decay: 0.99
    epsilon: 1.0e-5
    commitment_cost: 0.25
    learned_l1_sampling: true
    learned_l1_cascade: true
    learned_l1_cascade_base: 4
    learned_l1_cascade_norm: true
    learned_l1_cascade_norm_final: true
    learned_all_sampling: false
    quant_resi:
      enabled: true
      ratio: 0.5
      share_mode: 0
      learnable_ratio: false
    aux:
      fine_drop:
        prob: 0.5
        min_keep: 1
    levels:
      use_manual_levels: true
      manual_levels: [1, 4, 8, 14, 20, 26, 32, 40, 48, 56, 64]

train:
  seed: 42
  device: cuda
  precision: fp32
  batch_size: 16
  grad_accum_steps: 1
  num_workers: 0
  max_steps: 1000
  warmup_steps: 1000
  lr: 0.0005
  min_lr: 0.00005
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 100
  save_every: 2500
  mask_padding: true
  vq_loss_weight: 1.0
  run_dir: runs/godot-csharp-ncm-aligned/tokenizer
  validation_cache_dir: data/cache/godot-csharp-code-only/tokenizer-validation
  eval_every: 2500
  artifact_dir: artifacts/godot-csharp-ncm-aligned
  artifact_filename: tokenizer.pt
  evaluation_config: config/eval/code-starter.yaml
